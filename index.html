<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b1b">
<title>VANQUANG MOD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  color:#eef2ff;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(47,43,112,.38),transparent 48%),
    linear-gradient(180deg,#080d25 0%,#050b18 58%,#030914 100%);
}
.topbar{
  height:76px;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid rgba(119,139,201,.13);
  background:rgba(4,11,30,.86);
}
.brand{font-size:23px;font-weight:700;letter-spacing:.2px;color:#8b8cff}
.verified{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;margin-left:5px;border-radius:50%;
  background:#168cf0;color:white;font-size:12px;vertical-align:3px;
}
main{width:min(100% - 32px,680px);margin:0 auto;padding:56px 0 60px;text-align:center}
.logo-wrap{
  width:194px;height:194px;margin:0 auto 24px;border-radius:50%;
  padding:6px;background:linear-gradient(135deg,#7b65ff,#53bfff);
  box-shadow:0 0 22px rgba(98,105,255,.24);
}
.logo-wrap img{width:100%;height:100%;display:block;object-fit:cover;border:5px solid #071023;border-radius:50%}
.welcome{font-size:20px;color:#aab4d0;letter-spacing:1px;margin:0 0 12px}
h1{font-size:34px;margin:0 0 14px;font-weight:750}
.subtitle{font-size:17px;line-height:1.5;color:#8294f5;margin:0 auto 30px}
.contact{
  display:flex;justify-content:center;align-items:center;gap:12px;
  width:min(100%,510px);min-height:62px;margin:0 auto 30px;padding:14px 20px;
  border-radius:40px;text-decoration:none;color:#53b9ff;font-weight:700;
  background:linear-gradient(110deg,#092b57,#101b43);
  border:1px solid #245b99;box-shadow:0 0 0 2px rgba(28,109,185,.12),inset 0 1px 10px rgba(67,147,255,.08);
}
.contact .symbol{font-size:22px}
.mod-link{
  display:flex;align-items:center;gap:18px;text-align:left;
  width:100%;max-width:510px;min-height:112px;margin:0 auto;
  padding:15px 20px;border-radius:27px;text-decoration:none;color:#eef2ff;
  background:linear-gradient(110deg,#0b2148,#10162c);
  border:1px solid rgba(64,112,190,.55);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.mod-link img{width:78px;height:78px;object-fit:cover;border-radius:19px;flex:0 0 78px}
.mod-copy{font-size:21px;font-weight:700}
.mod-copy small{display:block;margin-top:7px;font-size:13px;font-weight:400;color:#93a5ca}
@media(max-width:420px){
 main{padding-top:48px}
 .logo-wrap{width:174px;height:174px}
 h1{font-size:29px}
 .subtitle{font-size:15px}
 .mod-copy{font-size:19px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">VANQUANG MOD <span class="verified" aria-label="Đã xác minh">✓</span></div>
</header>
<main>
  <div class="logo-wrap"><img src="assets/vanquang-logo.jpg" alt="Logo VANQUANG MOD"></div>
  <p class="welcome">Chào Mừng Đến Với</p>
  <h1>VANQUANG MOD <span class="verified" aria-label="Đã xác minh">✓</span></h1>
  <p class="subtitle">Hỗ trợ MOD Free Fire</p>
  <a class="contact" href="https://zaloapp.com/qr/p/p8pa8dlri07z?src=qr" target="_blank" rel="noopener">
    <span class="symbol">▣</span><span>Zalo Support</span>
  </a>
  <a class="mod-link" href="#" aria-label="MOD FFVN">
    <img src="assets/mod-ffvn.webp" alt="Logo MOD FFVN">
    <span class="mod-copy">MOD FFVN<small>MOD Free Fire Việt Nam</small></span>
  </a>
</main>
</body>
</html>
