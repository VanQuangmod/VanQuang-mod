<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanQuang - Chia sẻ Mod</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#17181c;--mute:#6b6e76;--line:#dcd8ce;--acc:#e4372c;--btn:#1f4fe0;--btn-t:#fff;--note:#e3efe6;--note-t:#1d5a34;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1b1c21;--ink:#f2f2f4;--mute:#9a9da6;--line:#2c2e35;--acc:#ff5a4d;--btn:#2d5cf0;--note:#10302a;--note-t:#7fe0a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--card:#1b1c21;--ink:#f2f2f4;--mute:#9a9da6;--line:#2c2e35;--acc:#ff5a4d;--btn:#2d5cf0;--note:#10302a;--note-t:#7fe0a8;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{position:relative;text-align:center;padding:22px 16px 10px}
.logo{font-size:26px;font-weight:800;letter-spacing:.06em;margin:0;display:flex;align-items:center;justify-content:center;gap:12px}
.mark{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#fff}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 12px 14px;border-bottom:1px solid var(--line)}
nav a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
nav a:hover,nav a:focus-visible{background:var(--card);outline:2px solid var(--acc)}
.search-wrap{max-width:680px;margin:0 auto 16px;padding:0 16px}
#searchInput{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px;outline:none}
main{max-width:680px;margin:0 auto;padding:0 16px 20px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;text-decoration:none;color:inherit}
.card:focus-visible{outline:2px solid var(--acc)}
.thumb{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:800;font-size:22px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.4);background-size:cover;background-position:center}
.card h2{font-size:18px;margin:14px 16px 2px;line-height:1.3}
.card p{margin:0 16px 14px;color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 20px;font-size:15px}
.warn{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:6px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-size:11px;font-weight:600;line-height:1.2}
.warn span{font-size:22px;line-height:1}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px 16px 30px}
</style>
</head>
