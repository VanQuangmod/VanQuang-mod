<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a1c">
<title>VANQUANG MOD</title>
<link rel="icon" href="img-logo.jpg">
<style>
:root{--bg1:#060a1c;--bg2:#121846;--ink:#eef0ff;--mute:#97a0d4;--acc:#8b8cff;--line:rgba(139,140,255,.3);--ok:#22c55e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;
background:
radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.8),transparent),
radial-gradient(1px 1px at 84% 12%,rgba(255,255,255,.7),transparent),
radial-gradient(1.5px 1.5px at 72% 38%,rgba(255,255,255,.6),transparent),
radial-gradient(1px 1px at 8% 52%,rgba(255,255,255,.6),transparent),
radial-gradient(1.5px 1.5px at 90% 64%,rgba(255,255,255,.7),transparent),
radial-gradient(1px 1px at 22% 82%,rgba(255,255,255,.5),transparent),
radial-gradient(1px 1px at 60% 92%,rgba(255,255,255,.6),transparent),
radial-gradient(130% 70% at 50% 0%,var(--bg2),var(--bg1) 72%)}
.top{padding:16px;text-align:center;font-size:20px;font-weight:700;color:var(--acc);border-bottom:1px solid var(--line)}
main{max-width:520px;margin:0 auto;padding:30px 20px 44px;text-align:center}
.avatar{position:relative;width:160px;height:160px;margin:6px auto 22px;padding:5px;border-radius:50%;background:conic-gradient(from 200deg,#6d5cff,#22d3ee,#8b5cf6,#6d5cff)}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff}
.dot{position:absolute;right:10px;bottom:10px;width:24px;height:24px;border-radius:50%;background:var(--ok);border:3px solid var(--bg2)}
.hello{margin:0;color:var(--mute);font-size:17px;letter-spacing:.04em}
h1{display:inline-flex;align-items:center;gap:10px;margin:6px 0 0;font-size:clamp(28px,9vw,40px);font-weight:800;line-height:1.15}
.tick{flex:none;width:30px;height:30px}
.typed{min-height:1.6em;margin:12px 0 26px;color:var(--acc);font-size:17px;font-weight:600}
.typed::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:3px;vertical-align:-.15em;background:var(--acc)}
@media (prefers-reduced-motion:no-preference){.typed::after{animation:blink 1s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}
.pill{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;border:1px solid var(--line);background:rgba(20,28,70,.78);color:var(--ink);font-size:17px;font-weight:700;text-decoration:none}
.pill svg{width:24px;height:24px;color:#3b9bff}
.cards{display:grid;gap:14px;margin-top:28px}
.card{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(60,80,200,.3),rgba(20,28,70,.6));color:var(--ink);text-align:left;text-decoration:none}
.card img{flex:none;width:64px;height:64px;border-radius:16px;object-fit:cover}
.card b{display:block;font-size:20px;color:#6fb4ff}
.card span{display:block;color:var(--mute);font-size:14px}
.pill:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<header class="top">VANQUANG MOD</header>
<main>
  <div class="avatar"><img src="img-logo.jpg" alt="Logo VANQUANG MOD"><span class="dot" title="Đang hoạt động"></span></div>
  <p class="hello">Chào mừng đến với</p>
  <h1>VANQUANG MOD
    <svg class="tick" viewBox="0 0 24 24" role="img" aria-label="Đã xác minh"><g fill="#1d9bf0"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" transform="rotate(45 12 12)"/></g><path d="M8 12.4l2.7 2.7 5.6-5.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </h1>
  <p class="typed" id="typed" data-text="Kho mod skin Free Fire cho Android và iOS"></p>

  <a class="pill" href="https://zaloapp.com/qr/p/p8pa8dlri07z?src=qr">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11.1c0 2.5 1.4 4.7 3.6 6.2L5 21l3.9-2.1c1 .3 2 .4 3.1.4 5.5 0 10-3.6 10-8.1S17.5 3 12 3z"/><circle cx="8.5" cy="11" r="1.2" fill="#0b1030"/><circle cx="12" cy="11" r="1.2" fill="#0b1030"/><circle cx="15.5" cy="11" r="1.2" fill="#0b1030"/></svg>
    Zalo Support
  </a>

  <div class="cards" id="cards"></div>
</main>

<script>
/* ===== THÊM MỤC MỚI: copy 1 dòng trong CARDS, đổi tên / mô tả / ảnh / link ===== */
const CARDS = [
  { title: "MOD FFVN", sub: "Mod skin Free Fire cho Android và iOS", logo: "img-ffvn.png", href: "./" }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("cards").innerHTML = CARDS.map(c => `
  <a class="card" href="${esc(c.href)}">
    <img src="${esc(c.logo)}" alt="" width="64" height="64">
    <div><b>${esc(c.title)}</b><span>${esc(c.sub)}</span></div>
  </a>`).join("");

/* Chữ gõ dần ở dòng giới thiệu (tắt nếu máy bật giảm chuyển động) */
const el = document.getElementById("typed");
const text = el.dataset.text;
if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  el.textContent = text;
} else {
  let i = 0;
  const tick = () => { el.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(tick, 45); };
  tick();
}
</script>
</body>
</html>
