<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo mã sự kiện VanQuang</title><style>
:root{color-scheme:dark;--bg:#090b12;--panel:#121827;--line:#27344b;--gold:#ffb52e;--cyan:#42d9ff;--muted:#a9b5c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17243b 0,#090b12 58%);color:#f4f7fb;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,480px)}.brand{text-align:center;color:var(--gold);font-weight:900;letter-spacing:2px;font-size:13px}.panel{margin-top:16px;background:linear-gradient(145deg,#151e30,#0e1421);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 18px 60px #0008}h1{text-align:center;margin:8px 0 7px;font-size:27px}p{color:var(--muted);line-height:1.55;text-align:center;font-size:14px}.tag{display:inline-block;color:var(--gold);border:1px solid #80591e;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:bold}.center{text-align:center}.field{margin:18px 0 8px}label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #34445e;background:#080e19;color:white;border-radius:11px;font-size:15px;outline:none}input:focus{border-color:var(--cyan)}button,.linkbtn{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin-top:12px;font-weight:800;font-size:14px;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(90deg,#ffb52e,#ff7b27);color:#17120a}.secondary{background:#1b2b43;color:#eaf5ff;border:1px solid #354b6a}.code{font-size:27px;letter-spacing:5px;text-align:center;font-weight:900;color:var(--cyan);padding:18px;background:#07111e;border:1px dashed #2d7690;border-radius:12px;margin:16px 0;overflow-wrap:anywhere}.status{font-size:13px;text-align:center;min-height:20px;color:#9fe6b2;margin-top:12px}.foot{font-size:11px;color:#718096;text-align:center;margin:16px 0}.row{display:flex;gap:10px}.row button{flex:1}
</style></head><body><main class="wrap"><div class="brand">⚡ VANQUANG MOD ⚡</div><section class="panel"><div class="center"><span class="tag">EVENT • CODE GENERATOR</span></div><h1>TẠO MÃ SỰ KIỆN</h1><p>Nhấn tạo mã để nhận mã ngẫu nhiên. Sau mỗi lần tạo, cần chờ đủ 12 giờ mới có thể tạo mã tiếp theo.</p><div class="code" id="code">••••••••</div><button id="generate">TẠO MÃ NGẪU NHIÊN</button><button class="secondary" id="copy">SAO CHÉP MÃ</button><div class="status" id="status" role="status"></div><div class="foot">Mã được lưu trong bộ nhớ trình duyệt hiện tại • © VanQuang</div></section></main><script>
const KEY='vq_event_code',TIME='vq_event_created',WAIT=12*60*60*1000;const $=id=>document.getElementById(id);let current=localStorage.getItem(KEY)||'';
function show(){ $('code').textContent=current||'••••••••';const t=Number(localStorage.getItem(TIME)||0),left=WAIT-(Date.now()-t);if(t&&left>0){$('generate').disabled=true;$('generate').style.opacity='.55';$('generate').textContent='THỬ LẠI SAU '+fmt(left);$('status').textContent='Bạn đã tạo mã. Thời gian chờ 12 giờ đang được áp dụng.';}else{$('generate').disabled=false;$('generate').style.opacity='1';$('generate').textContent='TẠO MÃ NGẪU NHIÊN';$('status').textContent=current?'Mã hiện tại vẫn có thể dùng để xác nhận.':'Sẵn sàng tạo mã mới.';}}
function fmt(ms){let h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h+' giờ '+m+' phút';}
$('generate').onclick=()=>{const t=Number(localStorage.getItem(TIME)||0);if(t&&Date.now()-t<WAIT){show();return;}const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';current=Array.from({length:8},()=>chars[Math.floor(Math.random()*chars.length)]).join('');localStorage.setItem(KEY,current);localStorage.setItem(TIME,String(Date.now()));show();$('status').textContent='Đã tạo mã mới thành công.';};
$('copy').onclick=async()=>{if(!current){$('status').textContent='Bạn cần tạo mã trước.';return;}try{await navigator.clipboard.writeText(current);$('status').textContent='Đã sao chép mã. Quay lại Web 1 để nhập mã.';}catch(e){$('status').textContent='Không thể tự sao chép. Hãy nhấn giữ mã để sao chép.';}};
show();setInterval(show,30000);
</script></body></html>
