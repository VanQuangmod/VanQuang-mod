<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sự kiện VanQuang</title><style>
:root{color-scheme:dark;--bg:#090b12;--panel:#121827;--line:#27344b;--gold:#ffb52e;--cyan:#42d9ff;--muted:#a9b5c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17243b 0,#090b12 58%);color:#f4f7fb;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,480px)}.brand{text-align:center;color:var(--gold);font-weight:900;letter-spacing:2px;font-size:13px}.panel{margin-top:16px;background:linear-gradient(145deg,#151e30,#0e1421);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 18px 60px #0008}h1{text-align:center;margin:8px 0 7px;font-size:27px}p{color:var(--muted);line-height:1.55;text-align:center;font-size:14px}.tag{display:inline-block;color:var(--gold);border:1px solid #80591e;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:bold}.center{text-align:center}.field{margin:18px 0 8px}label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #34445e;background:#080e19;color:white;border-radius:11px;font-size:15px;outline:none}input:focus{border-color:var(--cyan)}button,.linkbtn{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin-top:12px;font-weight:800;font-size:14px;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(90deg,#ffb52e,#ff7b27);color:#17120a}.secondary{background:#1b2b43;color:#eaf5ff;border:1px solid #354b6a}.code{font-size:27px;letter-spacing:5px;text-align:center;font-weight:900;color:var(--cyan);padding:18px;background:#07111e;border:1px dashed #2d7690;border-radius:12px;margin:16px 0;overflow-wrap:anywhere}.status{font-size:13px;text-align:center;min-height:20px;color:#9fe6b2;margin-top:12px}.foot{font-size:11px;color:#718096;text-align:center;margin:16px 0}.row{display:flex;gap:10px}.row button{flex:1}
</style></head><body><main class="wrap"><div class="brand">⚡ VANQUANG MOD ⚡</div><section class="panel"><div class="center"><span class="tag">EVENT • THAM GIA SỰ KIỆN</span></div><h1>XÁC NHẬN SỰ KIỆN</h1><p>Lấy mã tại Web 2, sau đó quay lại trang này và nhập mã để xác nhận.</p><div class="field"><label for="web2">BƯỚC 1 — LINK WEB 2 (TRANG TẠO MÃ)</label><input id="web2" type="url" placeholder="Dán link Web 2 tại đây"></div><button id="open">LẤY MÃ</button><div class="field"><label for="code">BƯỚC 2 — NHẬP MÃ ĐÃ NHẬN</label><input id="code" maxlength="12" autocomplete="off" placeholder="Nhập mã của bạn"></div><button id="confirm">XÁC NHẬN MÃ</button><div class="status" id="status" role="status"></div><div class="foot">© VanQuang • Event System</div></section></main><script>
const $=id=>document.getElementById(id);const defaultUrl=new URL('random-key.html',location.href).href;
$('web2').value=defaultUrl;
$('open').onclick=()=>{let raw=$('web2').value.trim();try{let u=new URL(raw);if(!/^https?:$/.test(u.protocol))throw 0;window.open(u.href,'_blank','noopener');$('status').textContent='Đã mở Web 2. Hãy tạo và sao chép mã, rồi quay lại đây.';}catch(e){$('status').textContent='Link Web 2 không hợp lệ.';}};
$('confirm').onclick=()=>{const entered=$('code').value.trim().toUpperCase();const saved=localStorage.getItem('vq_event_code');if(!entered){$('status').textContent='Bạn chưa nhập mã.';return;}if(!saved){$('status').textContent='Chưa tìm thấy mã trên trình duyệt này. Hãy tạo mã tại Web 2 trước.';return;}if(entered!==saved){$('status').textContent='Mã không chính xác. Vui lòng kiểm tra lại.';return;}$('status').textContent='Mã hợp lệ trên thiết bị này! Xác nhận thành công.';};
</script></body></html>
